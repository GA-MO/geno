  - id: ctl.steer-refused
    thai: steer ที่มีไฟล์แนบหรือ mention ถูกปฏิเสธ
    english: Steer refused
    chapter: 5
    priority: P3
    lanes:
      - panel
      - editor
      - server
    terminal: Stays queued, or back to the draft
  - id: ctl.stop-while-waiting
    thai: กด Stop ระหว่างรอ backoff หรือคิว

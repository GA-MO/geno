# The scenario catalog: chapters and the scenarios each one covers. Edit by hand; docs:check validates it against catalogSchema.
chapters:
  - number: 1
    prefix: start
    thai: "เริ่มต้นใช้งาน"
    english: Getting started
  - number: 2
    prefix: turn
    thai: "Turn ปกติ"
    english: Normal turn
  - number: 3
    prefix: mstop
    thai: "Model หยุดแบบไหนบ้าง"
    english: How the model stops
  - number: 4
    prefix: err
    thai: "Error และการ retry"
    english: Errors and retry
  - number: 5
    prefix: ctl
    thai: "Stop / Steer / Queue"
    english: Stop / Steer / Queue
  - number: 6
    prefix: ctx
    thai: "Context และ compaction"
    english: Context and compaction
  - number: 7
    prefix: tool
    thai: "Tool"
    english: Tools
  - number: 8
    prefix: perm
    thai: "Permission และโหมด"
    english: Permissions and modes
  - number: 9
    prefix: hook
    thai: "Hook"
    english: Hooks
  - number: 10
    prefix: sec
    thai: "Sandbox และความปลอดภัย"
    english: Sandbox and safety
  - number: 11
    prefix: edit
    thai: "การแก้ไฟล์"
    english: File edits
  - number: 12
    prefix: sub
    thai: "Subagent"
    english: Subagents
  - number: 13
    prefix: bg
    thai: "งานเบื้องหลังและการปลุก"
    english: Background work and wakes
  - number: 14
    prefix: wf
    thai: "Workflow / Arena / Lane"
    english: Workflows / Arena / Lanes
  - number: 15
    prefix: ext
    thai: "Skill / Command / MCP / Memory"
    english: Skills / Commands / MCP / Memory
  - number: 16
    prefix: sess
    thai: "Session และประวัติ"
    english: Sessions and history
  - number: 17
    prefix: ed
    thai: "Editor: Tab / Cmd-K / Review"
    english: "Editor features: Tab / Cmd-K / Review"
  - number: 18
    prefix: cli
    thai: "CLI"
    english: CLI
scenarios:
  - id: start.open-window
    thai: เปิดหน้าต่างและเชื่อม engine
    english: Window opens and connects to the engine
    chapter: 1
    priority: P1
    lanes:
      - editor
      - server
      - panel
    terminal: Panel shows the start page or the restored session
  - id: start.first-run-no-key
    thai: ส่งข้อความแรกโดยไม่มี API key
    english: First prompt with no API key
    chapter: 1
    priority: P1
    lanes:
      - user
      - panel
      - editor
      - server
    terminal: "`failed`, no engine started (or `startSession` throws), toast shown"
  - id: start.set-api-key
    thai: ตั้งค่า API key
    english: Store a provider key
    chapter: 1
    priority: P1
    lanes:
      - user
      - editor
      - server
    terminal: Engine reset; next send works
  - id: start.new-session-context
    thai: โหลดคำสั่งโปรเจกต์ หน่วยความจำ และสกิล
    english: Session opens with instructions, memory, skills
    chapter: 1
    priority: P1
    lanes:
      - server
      - loop
    terminal: "`session-start` frozen; first user message carries the context"
  - id: start.settings-change-restart
    thai: เปลี่ยนการตั้งค่าแล้ว engine เริ่มใหม่
    english: Settings or key change restarts the engine
    chapter: 1
    priority: P2
    lanes:
      - editor
      - server
    terminal: New engine for the new hash; the old engine idles out
  - id: start.attach-and-mention
    thai: แนบไฟล์และ @mention
    english: Attach files and @mention
    chapter: 1
    priority: P2
    lanes:
      - user
      - panel
      - editor
      - server
      - loop
    terminal: Continues as `turn.text-answer`, or `failed` on invalid params
  - id: turn.text-answer
    thai: ถามแล้วได้คำตอบเป็นข้อความ
    english: Ask and get a text answer
    chapter: 2
    priority: P1
    lanes:
      - user
      - panel
      - editor
      - server
      - loop
      - policy
      - model
    terminal: "`done` / `end_turn`"
  - id: turn.with-tools
    thai: โมเดลเรียกเครื่องมือแล้วตอบ
    english: Model calls tools, then answers
    chapter: 2
    priority: P1
    lanes:
      - user
      - panel
      - editor
      - server
      - loop
      - policy
      - tool
      - model
    terminal: "`done` / `end_turn`"
  - id: turn.prompt-while-running
    thai: ส่งข้อความซ้อนขณะเทิร์นทำงาน (ถูกปฏิเสธ)
    english: Second prompt while a turn runs is refused
    chapter: 2
    priority: P3
    lanes:
      - editor
      - server
    terminal: Request rejected with "a turn is already running"
  - id: turn.first-prompt-path
    thai: prompt แรกเดินทางจากแผงถึง model
    english: The first prompt travels from the panel to the model
    chapter: 2
    priority: P1
    lanes:
      - user
      - panel
      - editor
      - server
      - loop
      - model
    terminal: Continues as `turn.with-tools`
  - id: turn.test-fix-loop
    thai: แก้โค้ดแล้วรันเทสต์จนผ่าน
    english: Change the code and run the tests until they pass
    chapter: 2
    priority: P1
    lanes:
      - user
      - loop
      - policy
      - tool
      - model
    terminal: "`done` / `end_turn`"
  - id: mstop.no-reply-continue-retry
    thai: จบเทิร์นโดยไม่มีคำตอบ แล้วกด Continue/Retry
    english: Turn ends with no reply; Continue or Retry
    chapter: 3
    priority: P1
    lanes:
      - user
      - panel
      - editor
      - server
      - loop
    terminal: New turn (Continue = `CONTINUE_PROMPT`; Retry = the same text)
  - id: mstop.empty-answer-nudged
    thai: โมเดลจบเทิร์นเปล่า ถูกกระตุ้นหนึ่งครั้ง
    english: Empty answer nudged once
    chapter: 3
    priority: P2
    lanes:
      - loop
      - model
      - server
      - panel
    terminal: Continues; or `failed` / `error` after a second empty answer, plus the no-reply notice
  - id: mstop.limit-max-turns
    thai: ครบ 40 ครั้งของการเรียกโมเดล
    english: Run reaches 40 model calls
    chapter: 3
    priority: P2
    lanes:
      - loop
      - model
      - server
      - editor
      - panel
    terminal: "`failed` / `max-turns` (`max_turn_requests`)"
  - id: mstop.limit-budget
    thai: เกินงบ $0.40
    english: Run passes the cost cap
    chapter: 3
    priority: P2
    lanes:
      - loop
      - server
      - editor
      - panel
    terminal: "`failed` / `budget`"
  - id: mstop.refusal
    thai: โมเดลปฏิเสธ
    english: Model refuses
    chapter: 3
    priority: P2
    lanes:
      - model
      - loop
      - server
      - editor
      - panel
    terminal: "`failed` / `refusal`; prompt dropped"
  - id: mstop.max-tokens-text
    thai: คำตอบถูกตัดที่ขีดจำกัด output
    english: Answer cut at the output limit
    chapter: 3
    priority: P3
    lanes:
      - model
      - loop
      - server
      - panel
    terminal: "`failed` with no error block (see defect D3)"
  - id: mstop.max-tokens-cut-tool
    thai: ขีดจำกัด output ตัดการเรียกเครื่องมือ
    english: Output limit cuts a tool call
    chapter: 3
    priority: P3
    lanes:
      - model
      - loop
      - tool
    terminal: Next model call; `failed` after a second cut in a row
  - id: mstop.pause-turn
    thai: ผู้ให้บริการพักเทิร์นยาว
    english: Provider pauses a long turn
    chapter: 3
    priority: P3
    lanes:
      - model
      - loop
    terminal: Next model call
  - id: mstop.tool-use-without-calls
    thai: stop reason เป็น tool_use แต่ไม่มีการเรียก
    english: "`tool_use` stop with no calls, or null stop"
    chapter: 3
    priority: P3
    lanes:
      - model
      - loop
      - server
    terminal: "`failed` / `error`"
  - id: err.transient-retried
    thai: ข้อผิดพลาดชั่วคราว ลองใหม่อัตโนมัติ
    english: Transient error retried
    chapter: 4
    priority: P2
    lanes:
      - model
      - loop
      - server
      - panel
    terminal: Continues; or `failed` / `transport` after 3 retries
  - id: err.offline-wait
    thai: เครือข่ายหลุด รอแล้วกด Retry now
    english: Offline wait and Retry now
    chapter: 4
    priority: P2
    lanes:
      - external
      - loop
      - server
      - editor
      - panel
      - user
    terminal: Continues; `stopped`; or `failed` after 30 min
  - id: err.rate-limited
    thai: ถูกจำกัดอัตรา
    english: Rate limited
    chapter: 4
    priority: P2
    lanes:
      - model
      - loop
      - server
      - panel
      - user
    terminal: Continues; held until Retry now or Stop; or `failed`
  - id: err.stream-stalled
    thai: โมเดลเงียบ
    english: Stream stalls
    chapter: 4
    priority: P3
    lanes:
      - model
      - loop
      - panel
    terminal: Continues after one retry; else `failed` / `transport`
  - id: err.quota-or-fatal
    thai: เครดิตหมด คีย์ผิด หรือ 4xx
    english: Quota, bad key or other 4xx
    chapter: 4
    priority: P2
    lanes:
      - model
      - loop
      - server
      - panel
    terminal: "`failed` / `transport`"
  - id: err.exception-escapes-loop
    thai: exception หลุดออกจากลูป
    english: Non-provider exception ends the turn
    chapter: 4
    priority: P3
    lanes:
      - loop
      - server
      - editor
      - panel
    terminal: "`failed`; no `error` event logged (D1, D2)"
  - id: err.engine-crash-restart
    thai: engine ล่มแล้วเริ่มใหม่
    english: Engine dies and restarts
    chapter: 4
    priority: P3
    lanes:
      - server
      - editor
      - panel
    terminal: Prompt fails in the panel; on the new engine, wait sessions resume and children are marked interrupted
  - id: ctl.stop-while-streaming
    thai: กด Stop ขณะโมเดลกำลังเขียน
    english: Stop while the model streams
    chapter: 5
    priority: P1
    lanes:
      - user
      - panel
      - editor
      - server
      - loop
      - model
    terminal: "`stopped` / `cancelled`; prompt stays pending"
  - id: ctl.queued-followup
    thai: พิมพ์ต่อคิวไว้ขณะเทิร์นทำงาน
    english: Queue a follow-up
    chapter: 5
    priority: P1
    lanes:
      - user
      - panel
      - editor
    terminal: Sent as a new turn on `done`; put back in the composer on stopped or failed
  - id: ctl.stop-while-tools-run
    thai: กด Stop ขณะเครื่องมือทำงาน
    english: Stop while tools run
    chapter: 5
    priority: P2
    lanes:
      - user
      - editor
      - server
      - loop
      - tool
    terminal: "`stopped`; started calls marked stopped, others not-started"
  - id: ctl.stop-at-card
    thai: กด Stop ขณะการ์ดขออนุญาตรออยู่
    english: Stop while an approval card waits
    chapter: 5
    priority: P2
    lanes:
      - user
      - panel
      - editor
      - server
      - policy
      - loop
    terminal: "`stopped`; card shows Cancelled"
  - id: ctl.steer-delivered
    thai: ส่งข้อความแทรกเข้าเทิร์นที่กำลังทำงาน

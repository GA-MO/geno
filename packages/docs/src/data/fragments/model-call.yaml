# One trip to the model, up to the request going out: the decision, the safe point, the checkpoint, the gateway.
- id: decide
  lane: loop
  at: step
  do: >-
    `loopStep` อ่าน log แล้วตัดสินว่าขั้นต่อไปคือ `call-model` แต่ก่อนให้ผลนี้ทุกครั้งจะตรวจขีดจำกัดของรอบ
    คือจำนวนครั้งที่เรียกโมเดลและค่าใช้จ่าย ค่าตั้งต้นของ `gcode serve` และ `gcode agent` คือ 40 ครั้งและ $0.40
    ส่วน Cmd-K งานตามกำหนดเวลา และ workflow ใช้ขีดจำกัดของตัวเอง
  ref: packages/core/src/loop.ts#loopStep
  emits: [call-model]
  phase: calling-model

- id: deliver
  lane: loop
  at: drive
  do: >-
    จุดปลอดภัย `deliver()` เป็นที่เดียวที่ steer รายงานจากงานเบื้องหลัง โน้ตไฟล์ที่ถูกแก้ และ notice เข้าสู่ log
    ถ้ามี steer หรือสิ่งจากงานเบื้องหลังมาถึง loop จะกลับไปอ่าน log ใหม่ก่อน ส่วนโน้ตกับ notice ไม่ทำให้ต้องวนกลับ
    รอบที่ไม่มีอะไรมาถึงจึงเรียกโมเดลต่อได้เลย
  ref: packages/engine/src/drive.ts#deliver

- id: request
  lane: loop
  at: model-call
  do: >-
    `callModel` ตรวจว่าถึงเวลา compaction หรือยัง บันทึก `checkpoint` (commit ใน shadow git ไว้ให้ Undo และ Rewind)
    แล้วส่ง log ให้ gateway ซึ่งประกอบคำขอด้วย `buildRequest` โดย system prompt เป็นบล็อกเดียวที่ cache ไว้
  ref: packages/engine/src/drive.ts#callModel
  emits: [checkpoint]

- id: send
  lane: loop
  at: gateway
  do: >-
    gateway จอง slot ของผู้ให้บริการ (ค่าตั้งต้น 4 คำขอพร้อมกันต่อผู้ให้บริการ) แล้ว stream คำขอผ่าน wire
    ถ้าล้มเหลวชั่วคราวจะลองใหม่เองหลัง 1, 2 และ 4 วินาที หรือตามเวลาที่ผู้ให้บริการบอกให้รอ
  ref: packages/engine/src/gateway.ts#gatewayFor.turn

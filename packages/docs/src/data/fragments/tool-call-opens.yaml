# The opening of every tool scenario: from a logged tool_use to the call showing as running in the panel.
- id: decide
  lane: loop
  at: step
  do: >-
    `loopStep` เห็น `tool_use` ที่ยังไม่มีผล และไม่มี call ใดที่ต้องตอบโดยไม่รัน จึงตัดสินว่า `run-tools`
  ref: packages/core/src/loop.ts#loopStep
  emits: [run-tools]
  phase: running-tools

- id: pre-hooks
  lane: policy
  at: hooks
  do: >-
    ถ้า session มี hook ของเหตุการณ์เครื่องมือ (`toolHooks`) PreToolUse hooks ตัดสินทุก call ของรอบนี้ก่อน call แรกจะเริ่ม
    แต่ละ call ได้ `run` `ask` หรือ `refuse` ถ้า session ไม่มี hook แบบนี้เลย ขั้นนี้ไม่เกิดและทุก call รันตามปกติ
  ref: "packages/engine/src/drive.ts#\"steps = await hooks?.decide(toolUses\""
  emits: [PreToolUse]

- id: batch
  lane: loop
  at: tools
  do: >-
    `nextToolBatch` จัด call เป็นชุด: call ที่ไม่แก้อะไรและไม่ต้องถามใคร เช่นการอ่าน รันพร้อมกันได้ถึง 8 ตัว
    ส่วน `bash` `edit` และ call ที่อาจต้องถามผู้ใช้ รันทีละตัว ชุดถัดไปเริ่มหลังชุดก่อนจบ
  ref: packages/core/src/tool-batch.ts#nextToolBatch

- id: started
  lane: server
  at: updates
  do: >-
    ตอนที่แต่ละ call เริ่ม `watcher.toolStart` ส่ง `session/update` ชนิด `tool_call` สถานะ `in_progress` ให้ call นั้นหนึ่งครั้ง
  ref: "packages/engine/src/serve.ts#\"toolStart(use, title) {\""
  emits: [tool_call, in_progress]

- id: relay
  lane: editor
  at: chat
  alongside: true
  do: >-
    `updateActions` แปลง `tool_call` เป็น action ของขั้นใหม่ แล้ว `Chat.updated` ส่งต่อให้ webview
  ref: packages/extension/src/chat/session-updates.ts#updateActions

- id: shown
  lane: panel
  at: rail
  alongside: true
  do: >-
    บทสนทนาขึ้นขั้นใหม่ ชื่อขั้นมาจาก `describeCall` ของ engine
  sees: ชิปของ call เช่น "read package.json" พร้อมจุดที่กำลังหมุน
  ref: packages/extension/src/chat/webview.ts#render

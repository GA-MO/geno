# A finished batch: results logged in the model's order and shown under their steps.
- id: logged
  lane: loop
  at: tools
  do: >-
    เมื่อทั้งชุดจบ `runTools` บันทึก `tool-result` ตามลำดับที่โมเดลขอ ไม่ใช่ลำดับที่เสร็จ
    ผลที่ยาวมากถูกเก็บลงไฟล์ แล้วส่งเฉพาะส่วนต้นพร้อมที่อยู่ไฟล์
  ref: "packages/engine/src/drive.ts#\"for (const result of outcome.results) if (result !== undefined) await record(result);\""
  emits: [tool-result]

- id: update
  lane: server
  at: updates
  do: >-
    `watcher.logged` แปลงผลแต่ละตัวด้วย `toolResultUpdate` เป็น `tool_call_update` พร้อมสถานะ ข้อความ และ `APPROVAL_META`
  ref: packages/engine/src/session-replay.ts#toolResultUpdate
  emits: [tool_call_update, APPROVAL_META]

- id: relay
  lane: editor
  at: chat
  alongside: true
  do: >-
    `updateActions` อ่านสถานะและบันทึกการอนุญาต (`denialOf`) แล้วส่ง action ให้ webview
  ref: packages/extension/src/chat/session-updates.ts#updateActions

- id: shown
  lane: panel
  at: rail
  alongside: true
  do: >-
    ขั้นนั้นหยุดหมุนและแสดงผล
  sees: ขั้นขึ้นเครื่องหมายเสร็จหรือล้มเหลว ผลลัพธ์พับอยู่ใต้ขั้น การอ่านไฟล์ติดกันรวมเป็นชิปไฟล์แถวเดียว
  ref: packages/extension/src/chat/webview.ts#render

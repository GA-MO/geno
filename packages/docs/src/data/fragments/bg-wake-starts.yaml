# Something a session waited on arrived while no turn runs: it is logged, the gate opens, and a woken turn starts.
# The arrival itself (a report, a command's end, a monitor's line, a due wake-up, a PR's checks) is the page's step before.
- id: logged
  lane: server
  at: wakes
  do: >-
    สิ่งที่มาถึงเข้ากล่องข้อความของ session ไม่มี turn รันอยู่ `inbox.arrived` จึงให้ `logArrivals` บันทึกลง log
    ต่อจากงานเขียนที่ค้างของ session นั้น ตามชนิดของสิ่งที่มา: โน้ต `wake` ของ monitor wake-up หรือ PR,
    `background-end` ของคำสั่ง หรือ `child-end` กับรายงานของลูก แล้ว `wakes.soon` ให้ตัวปลุกดูประตู
  ref: packages/engine/src/background-hooks.ts#logArrivals

- id: gate
  lane: server
  at: wakes
  do: >-
    `WakeDriver.look` ข้าม session ของลูกและของ agent ภายนอก แล้วถาม `wakeGate`: การปลุกเปิดอยู่ไหม มี turn รัน
    การปลุกถูกพัก การ์ดค้าง หรือผู้ใช้กำลังพิมพ์ไหม รอ 2 วินาทีให้สิ่งที่มาใกล้กันรวมเป็นชุดเดียว และต้องมีหน้าต่างที่ต่ออยู่
  ref: packages/core/src/wake.ts#wakeGate

- id: wake
  lane: server
  at: wakes
  do: >-
    ประตูตอบ `wake` `WakeDriver` เลือกหน้าต่างที่แสดง session นี้ (หรือหน้าต่างแรกที่ต่ออยู่) ให้รัน `wakeTurn` ซึ่งเรียก `runTurn` แบบ `wake`
    `logWake` บันทึกข้อความแรกของ turn จาก engine เป็น event `user` ที่มี `from: 'wake'`
    แล้ว `runTurn` ส่งข้อความนั้นเป็น `user_message_chunk` พร้อม `WAKE_META` ขีดจำกัดของ turn นับต่อจาก prompt ล่าสุดของผู้ใช้
  ref: packages/engine/src/serve.ts#logWake
  emits: [user, user_message_chunk, WAKE_META]
  phase: starting

- id: adopt
  lane: editor
  at: chat
  do: >-
    แผงแสดง session นี้อยู่ `user_message_chunk` ที่มี `WAKE_META` จึงทำให้ `woken` เปิด turn ใหม่ในแผงโดยไม่มีข้อความของผู้ใช้
    และรับ turn นี้เป็นของตัว
    ปุ่ม Stop ใช้ได้เหมือน turn ที่ผู้ใช้ส่งเอง
  ref: packages/extension/src/chat/chat.ts#Chat.woken
  emits: [turn-start]

- id: head
  lane: panel
  at: rail
  alongside: true
  do: หัวของ turn ใหม่มีไอคอนกระดิ่งกับเหตุที่ปลุกแทนข้อความของผู้ใช้
  sees: >-
    กระดิ่งกับป้ายจาก `wakeLabel` เช่น "woke: monitor matched" หัวข้อเป็น "working" และปุ่ม Stop
  ref: packages/extension/src/chat/render.ts#turnHead

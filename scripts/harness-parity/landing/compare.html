<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Compare</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --ink: #1c1b19; --muted: #6b6862; --line: #e4e1da; --pick: #2f6b4f; --pick-soft: #eaf3ee; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; background: rgb(246 245 242 / .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 1680px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: -0.01em; }
  .group { display: flex; align-items: center; gap: 8px; }
  .group > span { color: var(--muted); font-size: 12px; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; font: 600 13px system-ui; color: var(--muted); padding: 0 14px; min-height: 34px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 600 13px system-ui; padding: 0 14px; min-height: 36px; border-radius: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: #c9c4ba; }
  .btn.reveal[aria-pressed="true"] { background: var(--pick-soft); border-color: var(--pick); color: var(--pick); }
  main { max-width: 1680px; margin: 0 auto; padding: 16px; display: grid; gap: 20px; }
  .row h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cell { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-width: 0; }
  .cell header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; min-height: 28px; }
  .cell header b { font-size: 14px; }
  .who { font-size: 12px; font-weight: 600; color: var(--pick); background: var(--pick-soft); padding: 2px 8px; border-radius: 999px; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .revealed .who { opacity: 1; }
  .frame { position: relative; overflow: hidden; border-radius: 8px; background: #ece9e3; margin: 0 auto; }
  .frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #fff; }
  .note { color: var(--muted); font-size: 12px; margin: 0; }
  .verdict { font-size: 12px; color: var(--muted); display: none; }
  .revealed .verdict { display: inline; }
  @media (prefers-reduced-motion: reduce) { .who, .seg button, .btn { transition: none; } }
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
  <h1>Blind Compare</h1>
  <div class="group"><span>Pair</span><div class="seg" id="pair" role="group" aria-label="Pair"></div></div>
  <div class="group"><span>Round</span><div class="seg" id="round" role="group" aria-label="Round"><button data-v="r1">First</button><button data-v="r2">After feedback</button></div></div>
  <div class="group"><span>Width</span><div class="seg" id="width" role="group" aria-label="Width"><button data-v="both">Both</button><button data-v="375">375</button><button data-v="1280">1280</button></div></div>
  <div class="actions">
    <button class="btn" id="reload" title="Load every page again to replay the load motion">Replay load</button>
    <button class="btn reveal" id="reveal" aria-pressed="false">Reveal sides</button>
  </div>
</div></div>
<main id="main">
  <p class="note">Pages are live: move the pointer over a hero, scroll inside a frame. The 1280 frames are scaled to fit, so the page still lays out at 1280. <span class="verdict" id="verdict"></span></p>
</main>
<script>
  const WIDTHS = { 375: 812, 1280: 800 };
  // A frame's own scrollbar eats into its width, so each frame is widened by it and the page lays out at 375 or 1280.
  const SCROLLBAR = (() => {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;top:-999px;width:100px;height:100px;overflow:scroll';
    document.body.append(probe);
    const width = probe.offsetWidth - probe.clientWidth;
    probe.remove();
    return width;
  })();
  const state = { pair: 1, round: 'r2', width: 'both', revealed: false, reveal: null, pairs: [] };
  const main = document.getElementById('main');
  const readHash = () => {
    const h = new URLSearchParams(location.hash.slice(1));
    const pair = Number(h.get('pair'));
    if (state.pairs.some((p) => p.pair === pair)) state.pair = pair;
    if (['r1', 'r2'].includes(h.get('round'))) state.round = h.get('round');
    if (['both', '375', '1280'].includes(h.get('width'))) state.width = h.get('width');
  };
  const writeHash = () => history.replaceState(null, '', `#pair=${state.pair}&round=${state.round}&width=${state.width}`);
  const press = (id, value) => { for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', String(b.dataset.v === String(value))); };

  // Each frame renders the page at its real width and is scaled down to the cell, so media queries see 375 or 1280.
  const fit = new ResizeObserver((entries) => {
    for (const { target } of entries) {
      const w = Number(target.dataset.w) + SCROLLBAR;
      const scale = Math.min(1, target.parentElement.clientWidth / w);
      target.style.width = `${w * scale}px`;
      target.style.height = `${WIDTHS[target.dataset.w] * scale}px`;
      target.firstElementChild.style.transform = `scale(${scale})`;
    }
  });

  function render() {
    for (const row of main.querySelectorAll('.row')) row.remove();
    fit.disconnect();
    const widths = state.width === 'both' ? [375, 1280] : [Number(state.width)];
    const who = state.reveal?.find((r) => r.pair === state.pair);
    for (const w of widths) {
      const row = document.createElement('section');
      row.className = 'row';
      row.innerHTML = `<h2>${w}px · ${state.round === 'r1' ? 'first round' : 'after feedback'}</h2><div class="cols"></div>`;
      for (const side of ['A', 'B']) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerHTML = `<header><b>Page ${side}</b><span class="who">${who && state.revealed ? who[side] : ''}</span></header><div class="frame" data-w="${w}"><iframe title="Page ${side} at ${w}px" width="${w + SCROLLBAR}" height="${WIDTHS[w]}" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" src="/p/${state.pair}-${side}/${state.round}/index.html"></iframe></div>`;
        row.querySelector('.cols').append(cell);
        fit.observe(cell.querySelector('.frame'));
      }
      main.append(row);
    }
    document.getElementById('verdict').textContent = who && state.revealed ? `Judge: ${who.judge[state.round]} wins this pair in this round.` : '';
    press('pair', state.pair);
    press('round', state.round);
    press('width', state.width);
    writeHash();
  }

  function bind(id, key, parse = (v) => v) {
    document.getElementById(id).addEventListener('click', (e) => {
      const b = e.target.closest('button[data-v]');
      if (!b) return;
      state[key] = parse(b.dataset.v);
      render();
    });
  }

  document.getElementById('reload').addEventListener('click', () => {
    for (const f of main.querySelectorAll('iframe')) f.src = f.src;
  });
  document.getElementById('reveal').addEventListener('click', async (e) => {
    const button = e.currentTarget;
    if (!state.revealed && state.reveal === null) {
      try {
        state.reveal = await (await fetch('/reveal.json')).json();
      } catch {
        button.textContent = 'Reveal failed, retry';
        return;
      }
    }
    state.revealed = !state.revealed;
    document.body.classList.toggle('revealed', state.revealed);
    button.setAttribute('aria-pressed', String(state.revealed));
    button.textContent = state.revealed ? 'Hide sides' : 'Reveal sides';
    const who = state.revealed ? state.reveal.find((r) => r.pair === state.pair) : undefined;
    for (const cell of main.querySelectorAll('.cell')) cell.querySelector('.who').textContent = who ? who[cell.querySelector('b').textContent.slice(-1)] : '';
    document.getElementById('verdict').textContent = who ? `Judge: ${who.judge[state.round]} wins this pair in this round.` : '';
  });

  fetch('/pairs.json').then((r) => r.json()).then((data) => {
    state.pairs = data.pairs;
    document.getElementById('pair').innerHTML = data.pairs.map((p) => `<button data-v="${p.pair}">${p.pair}</button>`).join('');
    bind('pair', 'pair', Number);
    bind('round', 'round');
    bind('width', 'width');
    readHash();
    render();
  }, () => {
    main.innerHTML = '<p class="note">Could not load the pairs. Is the compare server still running? Start it again and reload.</p>';
  });
</script>
</body>
</html>
